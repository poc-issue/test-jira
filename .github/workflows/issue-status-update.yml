name: Issue Status Update

on:
  pull_request_target:
    types: [opened, reopened, edited]

jobs:
  update-linked-issues:
    name: Mark linked issues as In Progress
    runs-on: ubuntu-latest

    steps:
      - name: Update linked issues to In Progress
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MY_TOKEN }}
          script: |
            const prBody = context.payload.pull_request.body || '';
            const prTitle = context.payload.pull_request.title || '';
            const branchName = context.payload.pull_request.head.ref || '';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // --- Step 1: Extract linked issue numbers ---
            const patterns = [
              /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*#(\d+)/gi,
              /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+https?:\/\/github\.com\/[^/]+\/[^/]+\/issues\/(\d+)/gi
            ];

            const issueNumbers = new Set();

            for (const text of [prBody, prTitle]) {
              for (const pattern of patterns) {
                let match;
                while ((match = pattern.exec(text)) !== null) {
                  issueNumbers.add(parseInt(match[1]));
                }
              }
            }

            const branchMatch = branchName.match(/(?:issue|bug|feat|feature)[/-](\d+)/i);
            if (branchMatch) {
              issueNumbers.add(parseInt(branchMatch[1]));
            }

            if (issueNumbers.size === 0) {
              console.log('ℹ️ No linked issues found.');
              console.log('💡 Tip: Use "Closes #123" or "Fixes #45" in the PR description.');
              return;
            }

            console.log(`🔍 Found linked issues: ${[...issueNumbers].map(n => '#' + n).join(', ')}`);

            // --- Step 2: Get the project from the PR itself ---
            const prNumber = context.payload.pull_request.number;
            const prProjectsQuery = await github.graphql(`
              query($owner: String!, $repo: String!, $prNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $prNumber) {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project {
                          id
                          number
                          title
                        }
                      }
                    }
                  }
                }
              }
            `, { owner, repo, prNumber });

            const projectItems = prProjectsQuery.repository.pullRequest.projectItems.nodes;

            if (projectItems.length === 0) {
              core.setFailed('❌ This PR is not added to any project. Add the PR to a GitHub Project first.');
              return;
            }

            const projectId = projectItems[0].project.id;
            const projectTitle = projectItems[0].project.title;
            const projectNum = projectItems[0].project.number;
            console.log(`✅ PR is in project: "${projectTitle}" (#${projectNum})`);

            // --- Step 3: Get the Status field and its options ---
            const fieldQuery = await github.graphql(`
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, { projectId });

            const statusField = fieldQuery.node.fields.nodes.find(
              f => f.name && f.name.toLowerCase() === 'status'
            );

            if (!statusField) {
              core.setFailed('❌ No "Status" field found in the project.');
              return;
            }

            const inProgressOption = statusField.options.find(
              o => o.name.toLowerCase() === 'in progress'
            );

            if (!inProgressOption) {
              const available = statusField.options.map(o => o.name).join(', ');
              core.setFailed(`❌ No "In Progress" option found in Status field. Available options: ${available}`);
              return;
            }

            console.log(`✅ Status field: "${statusField.name}" → Target: "${inProgressOption.name}"`);

            // --- Step 4: Update each linked issue ---
            for (const issueNumber of issueNumbers) {
              try {
                // Get the issue node ID
                const issueData = await github.rest.issues.get({
                  owner, repo, issue_number: issueNumber
                });

                if (issueData.data.state !== 'open') {
                  console.log(`⏭️ Issue #${issueNumber} is ${issueData.data.state}, skipping.`);
                  continue;
                }

                const issueNodeId = issueData.data.node_id;

                // Find the issue's item ID in the project
                const itemQuery = await github.graphql(`
                  query($projectId: ID!, $cursor: String) {
                    node(id: $projectId) {
                      ... on ProjectV2 {
                        items(first: 100, after: $cursor) {
                          nodes {
                            id
                            content {
                              ... on Issue {
                                id
                                number
                              }
                            }
                          }
                          pageInfo {
                            hasNextPage
                            endCursor
                          }
                        }
                      }
                    }
                  }
                `, { projectId });

                const projectItem = itemQuery.node.items.nodes.find(
                  item => item.content && item.content.number === issueNumber
                );

                if (!projectItem) {
                  console.log(`⚠️ Issue #${issueNumber} is not added to the project. Adding it now...`);

                  // Add the issue to the project
                  const addResult = await github.graphql(`
                    mutation($projectId: ID!, $contentId: ID!) {
                      addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                        item {
                          id
                        }
                      }
                    }
                  `, { projectId, contentId: issueNodeId });

                  var itemId = addResult.addProjectV2ItemById.item.id;
                  console.log(`✅ Added issue #${issueNumber} to the project.`);
                } else {
                  var itemId = projectItem.id;
                }

                // Update the Status field
                await github.graphql(`
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }) {
                      projectV2Item {
                        id
                      }
                    }
                  }
                `, {
                  projectId,
                  itemId,
                  fieldId: statusField.id,
                  optionId: inProgressOption.id
                });

                console.log(`✅ Issue #${issueNumber} → Status changed to "In Progress"`);

              } catch (e) {
                console.log(`❌ Failed to update issue #${issueNumber}: ${e.message}`);
              }
            }
